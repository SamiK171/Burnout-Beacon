<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%">
  <defs>
    <!-- Vibrant Coral-Orange Gradient for Dark Mode -->
    <linearGradient id="darkBeaconGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF3B30" />
      <stop offset="100%" stop-color="#FF9500" />
    </linearGradient>

    <!-- High-Contrast Text Gradient for Dark Backgrounds -->
    <linearGradient id="darkTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#FF3B30" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- ICON GROUP -->
  <g transform="translate(10, 10)">
    <!-- Base / Outer Pulse Ring 2 -->
    <path d="M 50 10 A 40 40 0 0 1 90 50" fill="none" stroke="#FF9500" stroke-width="3.5" stroke-linecap="round" opacity="0.5"/>
    <path d="M 10 50 A 40 40 0 0 1 50 10" fill="none" stroke="#FF3B30" stroke-width="3.5" stroke-linecap="round" opacity="0.3"/>
    
    <!-- Pulse Ring 1 -->
    <path d="M 50 22 A 28 28 0 0 1 78 50" fill="none" stroke="url(#darkBeaconGlow)" stroke-width="4.5" stroke-linecap="round" filter="url(#neonGlow)"/>
    <path d="M 22 50 A 28 28 0 0 1 50 78" fill="none" stroke="url(#darkBeaconGlow)" stroke-width="4.5" stroke-linecap="round" opacity="0.7"/>

    <!-- Signal Beacon Tower Base (Light Slate for Visibility) -->
    <path d="M 38 85 L 50 52 L 62 85 Z" fill="#334155" stroke="#475569" stroke-width="1.5" />
    <path d="M 34 88 L 66 88" stroke="#94A3B8" stroke-width="4" stroke-linecap="round" />

    <!-- Core Emitter Node -->
    <circle cx="50" cy="50" r="10" fill="url(#darkBeaconGlow)" filter="url(#neonGlow)" />
    <circle cx="50" cy="50" r="4" fill="#FFFFFF" />

    <!-- Metric Ray Accent -->
    <line x1="50" y1="50" x2="82" y2="18" stroke="#FF5252" stroke-width="3" stroke-dasharray="4 3" stroke-linecap="round" />
    <circle cx="82" cy="18" r="3.5" fill="#FF5252" />
  </g>

  <!-- TYPOGRAPHY GROUP -->
  <g transform="translate(125, 68)">
    <!-- Main Title with explicit space -->
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5" fill="url(#darkTextGrad)">Burnout <tspan fill="url(#darkBeaconGlow)">Beacon</tspan></text>
    
    <!-- Subtitle / Tagline -->
    <text x="2" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="2.5" fill="#94A3B8" text-transform="uppercase">DIAGNOSTICS &amp; ANALYTICS</text>
  </g>
</svg>
